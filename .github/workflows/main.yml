name: Android Native Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    # 替换掉报错的部分，直接使用系统自带的 NDK
    - name: 配置 Android NDK
      run: |
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk-bundle" >> $GITHUB_ENV
        # 如果需要特定版本，Ubuntu 镜像通常自带多个版本，
        # 我们这里直接使用默认路径，或者让 CMake 自动寻找

    - name: 配置 CMake (Android 交叉编译)
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk-bundle/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release

    - name: 执行编译
      run: cmake --build ${{github.workspace}}/build

    - name: 上传编译好的二进制文件
      uses: actions/upload-artifact@v4
      with:
        name: touch-arm64-v8a
        path: ${{github.workspace}}/build/touch
